<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact info</title>

    <style>
        /* Company name */
        h3{
            text-align:right;
            font-family:Georgia, 'Times New Roman', Times, serif;
            color:royalblue;
        }

        /* Tagline */
        p{
           text-align: center; 
           text-transform: uppercase;
           letter-spacing: 2px;
           margin-bottom: 20px;
        }

        /* Contact no */

        
          table {
            width: 50%;
            margin: 0 auto; 
            border-collapse: collapse;
        }

        table, th, td {
            border: 1px solid black;
        }

        th, td {
            text-align: center;
            vertical-align: middle;
            padding: 10px;
        }
     </style>
</head>
<body>
    <h3>
      Boat headphones
    </h3>

    <p>
        "Plug into nirvana."
    </p>

    <!-- table -->
    <table>
        <tr>
            <th>
                Department
            </th>
            <th>
                Contact No
            </th>
        </tr>
        <tr>
            <td>
                Product Design
            </td>
            <td>
                +91 (0123-456-789)
            </td>
         </tr>
         <tr>
            <td>
                Sales & Marketing
            </td>
            <td>
                +91 (0123-456-789)
            </td>
        </tr>
       
    </table>

</html>
