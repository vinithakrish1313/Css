<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- title -->
    <title>Restaurant Menu</title>


    <!-- Font Awesome Icons -->
     <!-- doubt -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <style>
        body {
            font-family: Arial, sans-serif;
        }

        /* 1. Restaurant Name Styling */
        h3 {
            text-align: right;
            font-family: Georgia, serif;
            font-size: 32px;
            color: darkred;
        }

        /* 2. Welcome Message Styling */
        .welcome {
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 3px;
            word-spacing: 10px;
            margin-bottom: 30px;
        }

        /* 3. Table Styling */
        table {
            width: 60%;
            margin: 0 auto;
            border-collapse: collapse;
        }

        table,th,td {
            border: 2px solid black;
        }

        th,td {
            text-align: center;
            vertical-align: middle;
            padding: 15px;
        }

        /* 4. Link Styling */
        a{
            text-decoration: none;
            color: darkblue;
        }

        a:hover {
            color: red;
        }
    </style>
</head>
<body>

    <!-- Heading with Icons -->
    <h3>
        <i class="bi-fork-knife"></i>
        Kattan with Kuttan Restaurant
        <i class="bi-cup-hot"></i>
    </h3>

    <!-- Welcome Message -->
    <p class="welcome">
        Welcome to the best taste experience in town
    </p>

    <!-- Menu Table -->
    <table>
        <tr>
            <th>Menu Item</th>
            <th>Price</th>
        </tr>
        <tr>
            <td>Grilled Chicken</td>
            <td>$12.99</td>
        </tr>
        <tr>
            <td>Cheese Pizza</td>
            <td>$9.99</td>
        </tr>
        <tr>
            <td>Choco volcano</td>
            <td>$6</td>
        </tr>
    </table>

    <br><br>

    <!-- Link -->
    <p style="text-align:center;">
        <a href="#">View Full Menu</a>
    </p>


  
</body>
</html>
