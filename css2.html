<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box model</title>
    <style>
        /* outer */
      .outer {
      border: 8px solid black;   
      padding: 30px;
      width: 300px;
      margin: 50px auto;
      }
      
    /* middle box */
     .middle {
      border: 6px solid royalblue;    
      padding: 25px;
    } 

    /* inner box */
    .inner {
      border: 4px solid grey;     
      padding: 20px;
      text-align: center;
    } 


    </style>

</head>
<body>
    <div class="outer">
        <div class="middle">
            <div class="inner">

            </div>
        </div>
    </div>

</body>
</html>
